Go2_W:
  pid:
    ctrl_rate: 50 #hz

    # x方向（前進後退）
    PID_x_Limmax: 0.2
    PID_x_Vmax: 1.5        # 降低最高速度，減少踏步
    PID_x_KP: 2.0           # 降低比例增益
    PID_x_KI: 0.05          # 降低積分增益
    PID_x_KD: 0.1           # 加入微分阻尼

    # y方向（側移 — 輪腿版無法側移！降低增益減少震盪）
    PID_y_Limmax: 0.15
    PID_y_Vmax: 0.3         # 大幅降低側移速度
    PID_y_KP: 1.0           # 大幅降低側移增益（輪腿無法真正側移）
    PID_y_KI: 0.02
    PID_y_KD: 0.0
    # yaw（旋轉）
    PID_yaw_Limmax: 0.2
    PID_yaw_Vmax: 0.6       # 降低旋轉速度
    PID_yaw_KP: 1.5         # 降低比例增益，減少踏步
    PID_yaw_KI: 0.05
    PID_yaw_KD: 0.3         # 加入微分阻尼，抑制震盪

    # about threshold
    # x方向
    threshold_x: 0.03
    # y方向
    threshold_y: 0.05
    # yaw（輪腿版無法旋轉到位，放寬閾值）
    threshold_yaw: 0.10     # 從 0.02 放寬到 0.10（~5.7°）

  ctrl:
    CurvatureSamplingInterval: 0.25    # 增加曲率採樣間隔，減少頻繁轉向
    # Planner 参数设置
    Planner/pub_rate: 40.0
    Planner/forwardDis: 0.8            # 降低前視距離，減少遠距離大轉彎
    Planner/transform_tolerance: 0.4   # 增加到達容忍度

    accurateThresholdRotate_x: 0.15
    accurateThresholdRotate_y: 0.2
    accurateThresholdRotate_yaw: 0.25  # 從 0.15 放寬到 0.25（~14°）

    accurateThresholdAdjust_x: 0.12
    accurateThresholdAdjust_y: 0.15
    accurateThresholdAdjust_yaw: 0.20  # 從 0.15 放寬到 0.20（~11°）

    accurateThresholdKeeping_x: 0.15
    accurateThresholdKeeping_y: 0.2
    accurateThresholdKeeping_yaw: 0.25


