// ========== YAML PARSER ==========
function parseYAML(text) {
    var m = {};
    text.split('\n').forEach(function(line) {
        var match = line.match(/^(\w+):\s*(.+)/);
        if (match) {
            var val = match[2].trim();
            if (val.startsWith('[')) {
                val = JSON.parse(val.replace(/'/g, '"'));
            } else if (!isNaN(val) && val !== '') {
                val = parseFloat(val);
            }
            m[match[1]] = val;
        }
    });
    return m;
}

// ========== SETUP ==========
var canvas = document.getElementById('map-canvas');
var ctx = canvas.getContext('2d');
var posX = document.getElementById('pos-x');
var posY = document.getElementById('pos-y');
var posYaw = document.getElementById('pos-yaw');
var poseNote = document.getElementById('pose-note');
var savedImageData = null;

var meta = parseYAML(MAP_YAML);
var MAP = {
    resolution: meta.resolution || 0.05,
    originX: (Array.isArray(meta.origin) ? meta.origin[0] : 0),
    originY: (Array.isArray(meta.origin) ? meta.origin[1] : 0),
    w: 0, h: 0
};

var TASK_POINTS = (TASKS_JSON.points || []).map(function(p, i) {
    var colors = ['#1890ff','#52c41a','#fa8c16','#722ed1','#eb2f96'];
    return {
        name: p.tts_text || p.comment || '\u9ede ' + i,
        x: p.x, y: p.y,
        color: colors[i % 5]
    };
});

function worldToCanvas(wx, wy) {
    return {
        x: (wx - MAP.originX) / MAP.resolution,
        y: MAP.h - (wy - MAP.originY) / MAP.resolution
    };
}

// ========== DRAW ==========
function drawMap(imageData) {
    ctx.clearRect(0, 0, MAP.w, MAP.h);
    if (imageData) ctx.putImageData(imageData, 0, 0);
    TASK_POINTS.forEach(function(pt) {
        var p = worldToCanvas(pt.x, pt.y);
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = pt.color;
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 0.5;
        ctx.stroke();
        ctx.fillStyle = '#333';
        ctx.font = '2.5px sans-serif';
        ctx.fillText(pt.name.length > 15 ? pt.name.slice(0,15)+'\u2026' : pt.name, p.x + 3, p.y - 1);
    });
}

// ========== POSE FETCH ==========
function fetchPose() {
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'robot_pose.json?' + Date.now(), true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    try {
                        var d = JSON.parse(xhr.responseText);
                        poseNote.textContent = '';
                        var x = parseFloat(d.x) || 0, y = parseFloat(d.y) || 0;
                        var qx = parseFloat(d.q_x) || 0, qy = parseFloat(d.q_y) || 0;
                        var qz = parseFloat(d.q_z) || 0, qw = parseFloat(d.q_w) || 1;
                        var yaw = Math.atan2(2 * (qw * qz + qx * qy), 1 - 2 * (qy * qy + qz * qz)) * 180 / Math.PI;

                        drawMap(savedImageData);

                        var p = worldToCanvas(x, y);
                        var ang = yaw * Math.PI / 180;

                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(-ang + Math.PI / 2);
                        ctx.beginPath();
                        ctx.moveTo(0, -8); ctx.lineTo(6, 6); ctx.lineTo(-6, 6); ctx.closePath();
                        ctx.fillStyle = '#ff4d4f'; ctx.fill();
                        ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
                        ctx.restore();

                        ctx.beginPath();
                        ctx.arc(p.x + Math.cos(ang) * 10, p.y - Math.sin(ang) * 10, 1.5, 0, Math.PI * 2);
                        ctx.fillStyle = '#ff4d4f'; ctx.fill();

                        posX.textContent = x.toFixed(3) + ' m';
                        posY.textContent = y.toFixed(3) + ' m';
                        posYaw.textContent = yaw.toFixed(1) + '\u00b0';
                    } catch(e) { /* parse error */ }
                }
            }
        };
        xhr.send();
    } catch(e) {
        // file:// CORS block - expected
        if (!poseNote.textContent) {
            poseNote.textContent = '\u26a0\ufe0f \u6a5f\u5668\u4eba\u4f4d\u59ff\u9700\u8981\u7d93\u7531 HTTP \u670d\u52d9\u5668\u7375\u53d6\u3002\u5730\u5716\u548c\u4efb\u52d9\u9ede\u5df2\u53ef\u7528\u3002';
        }
    }
}

// ========== INIT ==========
function init() {
    canvas.width = 800;
    canvas.height = 600;
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    var img = new Image();
    img.onload = function() {
        MAP.w = img.width;
        MAP.h = img.height;

        var scale = Math.min(2, 800 / MAP.w, 600 / MAP.h);
        canvas.width = MAP.w * scale;
        canvas.height = MAP.h * scale;
        ctx.setTransform(scale, 0, 0, scale, 0, 0);

        // Draw map image to offscreen canvas, get ImageData
        var off = document.createElement('canvas');
        off.width = MAP.w;
        off.height = MAP.h;
        var offCtx = off.getContext('2d');
        offCtx.drawImage(img, 0, 0);
        savedImageData = offCtx.getImageData(0, 0, MAP.w, MAP.h);

        drawMap(savedImageData);

        var tl = document.getElementById('task-list');
        tl.innerHTML = TASK_POINTS.map(function(pt) {
            return '<span> \ud83d\udccd <b>' + (pt.name.length > 20 ? pt.name.slice(0, 20) + '\u2026' : pt.name) + '</b> (' + pt.x.toFixed(2) + ', ' + pt.y.toFixed(2) + ')</span>';
        }).join('');
    };
    img.onerror = function() {
        document.getElementById('status').textContent = '\u26a0\ufe0f map image load failed';
        document.getElementById('status').style.background = '#fa8c16';
    };
    img.src = MAP_PNG_B64;
}

setInterval(fetchPose, 2000);
